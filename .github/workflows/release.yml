name: Create Release

on:
  workflow_dispatch:
  # Release automatically when a script change reaches master. Versions that already have a tag are
  # skipped, so only commits that bump vaft's @version produce a release.
  push:
    branches:
      - master
    paths:
      - "vaft/**"
      - "video-swap-new/**"
      - "strip/**"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    - name: Install dev dependencies
      run: npm ci

    - name: Check syntax of all scripts
      run: npm run syntax

    - name: Run unit tests
      run: npm test

    - name: Get version from script
      id: version
      run: |
        VERSION=$(grep -m1 '@version' vaft/vaft.user.js | sed 's/.*@version\s*//')
        # The version ends up in tag names and shell commands: digits and dots only
        if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
          echo "Unexpected @version: '$VERSION'" >&2
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Check whether this version is already released
      id: existing
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
          echo "tag=true" >> "$GITHUB_OUTPUT"
          echo "v$VERSION already tagged"
        else
          echo "tag=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Git user
      if: steps.existing.outputs.tag == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Update permalink hashes in README
      if: steps.existing.outputs.tag == 'false'
      run: |
        CURRENT_HASH=$(git rev-parse HEAD)
        sed -i "s|/Helli24/TwitchAdSolutions/[a-f0-9]\{40\}/|/Helli24/TwitchAdSolutions/${CURRENT_HASH}/|g" README.md
        git add README.md

    # Commit and tag go up in one atomic push: either both arrive or neither. With two separate pushes a
    # failed tag push (GitHub answered 500 for v68.10.0) left the version commit on master without a tag,
    # and the re-run added a second version commit.
    - name: Create version commit and tag
      if: steps.existing.outputs.tag == 'false'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git diff --cached --quiet || git commit -m "v$VERSION"
        git tag -a "v$VERSION" -m "Release v$VERSION"
        git push --atomic origin HEAD:master "refs/tags/v$VERSION"

    # A manual run for an already tagged version re-attaches the assets to its existing release.
    - name: Build release assets
      if: steps.existing.outputs.tag == 'false' || github.event_name == 'workflow_dispatch'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        mkdir -p "$RUNNER_TEMP/dist"
        cp vaft/vaft.user.js vaft/vaft-ublock-origin.js \
           vaft/twitch-brave-fix.user.js vaft/twitch-brave-fix-ublock-origin.js \
           video-swap-new/video-swap-new.user.js video-swap-new/video-swap-new-ublock-origin.js \
           strip/strip.user.js "$RUNNER_TEMP/dist/"
        cd "$RUNNER_TEMP/dist"
        zip -q "TwitchAdSolutions-v${VERSION}.zip" *.js
        sha256sum *.js *.zip > SHA256SUMS
        cat SHA256SUMS

    - name: Extract release notes
      if: steps.existing.outputs.tag == 'false' || github.event_name == 'workflow_dispatch'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Only the CHANGELOG section of this version, not the whole file
        awk -v head="## v$VERSION " 'index($0, head) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
        [ -s "$RUNNER_TEMP/release-notes.md" ] || echo "See CHANGELOG.md" > "$RUNNER_TEMP/release-notes.md"

    # GitHub's own CLI (preinstalled on the runner) instead of a third-party action holding the write token
    - name: Publish release
      if: steps.existing.outputs.tag == 'false' || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        cd "$RUNNER_TEMP/dist"
        if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release upload "v$VERSION" *.js *.zip SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "v$VERSION" --title "vaft v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
        else
          gh release create "v$VERSION" *.js *.zip SHA256SUMS --verify-tag --title "vaft v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
        fi
