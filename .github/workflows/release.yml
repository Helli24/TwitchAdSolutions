name: Create Release

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install acorn
      run: npm install -g acorn

    - name: Validate userscripts
      run: |
        for f in vaft/vaft.user.js vaft/vaft_testing.user.js video-swap-new/video-swap-new.user.js strip/strip.user.js; do
          echo "Validating $f..."
          acorn --ecma2022 "$f" > /dev/null
        done

    - name: Validate uBlock scripts
      run: |
        for f in vaft/vaft-ublock-origin.js vaft/vaft-testing-ublock-origin.js video-swap-new/video-swap-new-ublock-origin.js video-swap-new/video-swap-new-ublock-origin-testing.js; do
          echo "Validating $f..."
          tail -n +2 "$f" | acorn --ecma2022 > /dev/null
        done

    - name: Get version from script
      id: version
      run: |
        VERSION=$(grep -m1 '@version' vaft/vaft.user.js | sed 's/.*@version\s*//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Set up Git user
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Update permalink hashes in README
      run: |
        CURRENT_HASH=$(git rev-parse HEAD)
        sed -i "s|/Helli24/TwitchAdSolutions/[a-f0-9]\{40\}/|/Helli24/TwitchAdSolutions/${CURRENT_HASH}/|g" README.md
        git add README.md

    - name: Create version commit and tag
      run: |
        git commit -m "v${{ steps.version.outputs.version }}"
        git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
        git push origin master
        git push origin "v${{ steps.version.outputs.version }}"

    - name: Extract release notes
      run: |
        # Only the CHANGELOG section of this version, not the whole file
        awk -v head="## v${{ steps.version.outputs.version }} " 'index($0, head) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
        [ -s "$RUNNER_TEMP/release-notes.md" ] || echo "See CHANGELOG.md" > "$RUNNER_TEMP/release-notes.md"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.version.outputs.version }}"
        name: "vaft v${{ steps.version.outputs.version }}"
        body_path: ${{ runner.temp }}/release-notes.md
        draft: false
        prerelease: false
