name: Validate JS

on:
  push:
    paths:
      - "**/*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "**/*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    - name: Install dev dependencies
      run: npm ci

    - name: Check syntax of all scripts
      run: npm run syntax

    - name: Run unit tests (loads the functions from vaft.user.js and vaft-ublock-origin.js)
      run: npm test
