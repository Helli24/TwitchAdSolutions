name: Bug Report
description: Report an issue with TwitchAdSolutions
labels: ["bug"]
body:
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting, please check
      options:
        - label: I am using the latest version (not a permalink)
        - label: I have restarted my browser / disabled and re-enabled uBlock Origin
        - label: "Tampermonkey only: Settings → Config mode Expert → Content Script API is set to `UserScripts API Dynamic` (see README → Install)"
        - label: I have checked [Known Extension Conflicts](https://github.com/Helli24/TwitchAdSolutions/blob/master/README.md#known-extension-conflicts) — 7TV, TTV-AB, Purple AdBlock, and TwitchNoSub are known to cause issues

  - type: dropdown
    id: script
    attributes:
      label: Which script are you using?
      options:
        - vaft (userscript)
        - vaft (uBlock Origin)
        - video-swap-new (userscript)
        - video-swap-new (uBlock Origin)
        - strip (userscript)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Script version
      description: "Open the browser console (F12) — the script logs it at load, e.g. `[AD DEBUG] TwitchAdSolutions vaft v102 loading`. Otherwise check your userscript manager or uBlock filter list."
      placeholder: "e.g. vaft v102 (68.9.1)"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Brave
        - Edge
        - Safari
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - uBlock Origin
        - Tampermonkey
        - Violentmonkey
        - Brave (built-in)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the issue (black screen, buffering, ads showing, etc.)
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Open browser console (F12), filter for `AD DEBUG` and paste the lines from page load through the problem (at least from `vaft … loading`; for ads also `Ad detected` … `Playback diag (ad end)`)
      render: shell
    validations:
      required: false

  - type: textarea
    id: extensions
    attributes:
      label: Other Twitch extensions installed
      description: List any other Twitch-related extensions (7TV, BTTV, FFZ, TTV-AB, Purple AdBlock, etc.)
      placeholder: "e.g. 7TV, BetterTTV, FrankerFaceZ"
    validations:
      required: true

  - type: checkboxes
    id: conflicts
    attributes:
      label: Troubleshooting
      options:
        - label: I have disabled ALL other Twitch-related extensions and the issue still occurs (including but not limited to 7TV, BTTV, FFZ, TTV-AB, Purple AdBlock, AdGuard, and any other ad blockers or Twitch enhancers)
        - label: Issue persists after clearing browser cache and restarting
        - label: Issue does NOT occur without the script installed
